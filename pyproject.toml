[project]
name = "spire-atspi"
version = "0.1.0"
description = "Semantic, pixel-free Linux desktop UI testing toolkit (AT-SPI) built for humans and AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spire*"]

[tool.pytest.ini_options]
testpaths = ["examples"]
